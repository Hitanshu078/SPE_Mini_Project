# Fixed project name so every Jenkins run updates the same stack
name: spe-calculator

services:
  calculator:
    # Jenkins sets IMAGE_NAME and IMAGE_TAG; defaults are for running by hand
    image: ${IMAGE_NAME:-hitanshu078/spe-calculator}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-Xms128m -Xmx256m"
      TZ: "Asia/Kolkata"
    expose:
      - "8080"
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - calc-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 8081 on the host because Jenkins already uses 8080
      - "${PROXY_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
