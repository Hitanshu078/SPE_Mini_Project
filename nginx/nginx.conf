# Reverse proxy in front of the calculator replicas.
server {
    listen 80;

    # Docker's embedded DNS. Re-resolving every 10s means nginx picks up
    # new container IPs after a redeploy instead of caching stale ones.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which replica served the request (useful to demo load balancing)
        add_header X-Upstream-Server $upstream_addr always;
    }
}
